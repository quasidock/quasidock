# Publishes a release of quasidock when a tag v<version> is pushed, the version
# being internal/version/version.go's: the unit tests, then scripts/package.sh's
# files, checked by tests/install.sh, as the release's assets (the zip,
# install.ps1, SHA256SUMS), with notes listing the programs' hashes. The
# programs are built without debug information, so a build of the tag
# anywhere, with the same Go toolchain, has those hashes. Images are still
# published by the separate, manually dispatched Publish images workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
#      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
#        with:
#          version: 0.17.0

      - name: The tag matches internal/version/version.go
        shell: bash
        run: |
          version=$(sed -n 's/.*const Version = "\([^"]*\)".*/\1/p' internal/version/version.go | head -1)
          if [ -z "$version" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but internal/version/version.go has $version"
              exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Public image registry is ready for the default-registry change
        shell: bash
        env:
          QUASIDOCK_REGISTRY: ghcr.io/quasidock/quasidock
        run: |
          grep -q -- '-----BEGIN PUBLIC KEY-----' internal/trust/quasidock.pub
          bash scripts/check-pins.sh

      - name: Package
        shell: bash
        run: bash scripts/package.sh

      - name: tests/install.sh, on the package
        shell: bash
        env:
          PACKAGE_DIR: out\release
        run: bash tests/install.sh

      # Not published if Defender flags these bytes: Windows wouldn't start them
      # (docs/findings.md). Says so and goes on where it can't scan.
      - name: What Defender makes of the programs
        shell: bash
        run: bash scripts/defender-scan.sh out/release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "quasidock ${GITHUB_REF_NAME#v}" --notes-file notes.md \
              quasidock-x86_64-windows.zip install.ps1 SHA256SUMS
