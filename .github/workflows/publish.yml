  finish:
    needs: [prepare, image_busybox, image_mingit, image_node, image_prettier, image_python, image_zig, image_sqlite, image_rust, image_ripgrep, image_bat, image_go, image_fzf, image_zot, image_oras, image_skopeo, image_cosign, image_cmake, image_zstd, image_meson, image_zls, image_perl, image_cargo_c, image_llvm_mingw, image_gettext, image_gtk4_sdk_base, image_gtk4_sdk, image_gtk4, image_gnome_text_editor, image_rnote, image_gtk3_sdk, image_gtk3, image_gtk3demo, image_gnumeric, image_pygobject_sdk, image_pygobject, image_meld, image_gaphor, image_7zip, image_notepad_plus_plus, image_sumatrapdf, image_vlc, image_php_sdk, image_php, image_composer, image_kanboard, image_java_sdk, image_java, image_maven, image_gradle, image_pdfbox, image_plantuml, image_logisim_evolution, image_scenebuilder, image_qt6_sdk_base, image_qt6_sdk, image_qt6, image_flameshot, image_notes, image_ghostscript, image_texlive, image_gdal_sdk, image_gdal, image_make, image_postgresql_sdk, image_postgresql, image_osm2pgsql, image_vscodium]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      QUASIDOCK_REGISTRY: ghcr.io/quasidock/quasidock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Isolate the publishing store
        run: '"QUASIDOCK_HOME=$env:RUNNER_TEMP\publish-store" >> $env:GITHUB_ENV'
      - uses: actions/download-artifact@v8
        with:
          name: publish-programs
          path: out/bin
      - uses: actions/download-artifact@v8
        with:
          pattern: publish-report-*
          path: out/reports
          merge-multiple: true
      - name: Collect verified results and pin patch
        shell: bash
        run: out/bin/quasidock-publish.exe collect out/reports out/publishing
      - name: Publish candidate catalog
        shell: bash
        env:
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: out/bin/quasidock-publish.exe catalog out/reports "ci-$GITHUB_RUN_ID"
      - name: Verify anonymous access before promotion
        shell: bash
        run: out/bin/quasidock-publish.exe verify out/reports
      - name: Promote exact verified digests; catalog last
        shell: bash
        env:
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: out/bin/quasidock-publish.exe promote out/reports
      - name: Verify final tags, pins, and searchable catalog anonymously
        shell: bash
        run: |
          out/bin/quasidock-publish.exe verify-release out/reports
          bash scripts/check-pins.sh out/publishing/recipes/*.json
          out/bin/quasidock.exe search
      - name: Keep result report even if promotion fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publishing-result
          path: out/publishing
          overwrite: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Run summary
        if: always()
        shell: bash
        run: test ! -f out/publishing/summary.md || cat out/publishing/summary.md >> "$GITHUB_STEP_SUMMARY"
