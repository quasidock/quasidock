# Checks that the published recipes build the same images on a fresh machine,
# and runs the end-to-end suites there, in jobs that run side by side:
# - published, one job for each group of scripts/published-groups.txt: the
#   group's recipes built and compared with the images published for the
#   recipes' versions (tests/published.sh);
# - suites: the suites in tests/ that run apps, in a store of the published
#   images (tests/seed-store.sh), which the published jobs check are what the
#   recipes build;
# - build, one job for each group of tests/build.sh's sections: the group's
#   checks, in stores of their own, downloading what they build from; the
#   base group's job runs the unit tests first.
# And two quick ones:
# - groups: the groups the published and build jobs are made from, and
#   whether GTK's and Qt's families are checked;
# - pins: every image the published recipes pin is on the registry, so a
#   fresh store can build them (scripts/check-pins.sh), scripts/upstream.txt
#   covers their sources (tests/upstream.sh), and scripts/rebuild.sh works
#   (tests/rebuild.sh).
# It only verifies; scripts/publish.sh publishes.
name: Reproduce

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 03:14 UTC.
    - cron: '14 3 * * 1'

permissions:
  contents: read
  packages: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-cli:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Local images, containers, mounts, and sandbox integration
        run: go test -count=1 ./internal/store ./internal/cli ./internal/commit ./internal/oci ./internal/environment ./internal/mounts ./internal/grants ./internal/hkcu ./internal/run ./internal/process ./internal/win32 ./internal/publishing ./cmd/quasidock-publish

      - name: Candidate publishing contract, offline
        shell: bash
        run: |
          bash tests/publish.sh
          bash tests/pins.sh

  # Requests to the registry, no building: Linux is enough.
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: The published recipes' pins, on the registry
        run: bash scripts/check-pins.sh

      - name: The upstream checker, and its table against the recipes
        run: bash tests/upstream.sh

      - name: Rebuild ordering and local repinning, offline
        run: |
          bash tests/rebuild.sh
          bash tests/repin.sh

  # The groups of scripts/published-groups.txt this run checks, and those of
  # tests/build.sh, as JSON lists, and whether gtk-suites runs.
  groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the last run that passed.
      actions: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      gtk: ${{ steps.groups.outputs.gtk }}
      qt: ${{ steps.groups.outputs.qt }}
      build: ${{ steps.groups.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
          # The history, to compare with the last commit a run passed on.
          fetch-depth: 0

      - id: groups
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push is compared with the last commit a run on its branch passed
          # on, a pull request with its base; the weekly run and one started
          # by hand check everything.
          base=""
          case $EVENT in
          push) base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow reproduce.yml --branch "$GITHUB_REF_NAME" --status success -L 1 --json headSha -q '.[0].headSha' || true) ;;
          pull_request) base=$PR_BASE ;;
          esac
          [ "$base" != null ] || base=""
          bash scripts/ci-groups.sh $base 2>why.txt | tee -a "$GITHUB_OUTPUT"
          cat why.txt | tee -a "$GITHUB_STEP_SUMMARY"
          build=$(bash tests/build.sh --groups | jq -Rnc '[inputs]')
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  published:
    needs: [groups, pins]
    name: published (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "BUILD_HOME=$t\\store" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Seed BusyBox sources from GHCR
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: go run ./cmd/quasidock-publish seed-busybox

      - name: Build quasidock
        run: go run ./scripts/build.go

      - name: Build the group's recipes and compare them with the published images
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/published.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/published.txt"

      # On every run, not only a failed one: each build log says how long
      # each of its commands took. Also when the job times out (iteration
      # 48's apps job did, and left nothing to read).
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-published-${{ matrix.group }}
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore
          retention-days: 14

  # Apache is built locally until its first publication; the published-image
  # lists must only contain images that are already available in the registry.
  apache:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build quasidock
        run: go run ./scripts/build.go
      - name: Build Apache in two independent stores
        shell: bash
        env:
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          export MSYS_NO_PATHCONV=1
          mkdir -p "$RUNNER_TEMP/apache-logs"
          for store in apache-one apache-two; do
            export QUASIDOCK_HOME="$RUNNER_TEMP/$store"
            ./out/bin/quasidock.exe build recipes/apache.json 2>&1 | tee "$RUNNER_TEMP/apache-logs/$store.log"
            ./out/bin/quasidock.exe inspect -f '{{.Id}}' apache | tr -d '\r' >"$RUNNER_TEMP/apache-logs/$store.digest"
          done
          cmp "$RUNNER_TEMP/apache-logs/apache-one.digest" "$RUNNER_TEMP/apache-logs/apache-two.digest"
      - name: HTTP and TLS in every sandbox
        shell: bash
        env:
          APACHE_HOME: ${{ runner.temp }}/apache-two
          LOG_DIR: ${{ runner.temp }}/apache-logs
        run: bash tests/apache.sh 2>&1 | tee "$RUNNER_TEMP/apache-logs/tests.log"
      - name: Upload Apache logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-apache
          path: ${{ runner.temp }}/apache-logs
          if-no-files-found: ignore
          retention-days: 14

  suites:
    needs: pins
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "BUILD_HOME=$t\\store" "SEED_DOWNLOADS=$t\\store\\cache\\downloads" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Seed BusyBox sources from GHCR
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: go run ./cmd/quasidock-publish seed-busybox

      - name: Build quasidock
        run: go run ./scripts/build.go

      # The apps tests/matrix.sh runs, zot for tests/zot.sh and ZLS for
      # tests/zls.sh. BusyBox and Node are built, for their downloads, which
      # the suites' own stores are seeded with.
      - name: The suites' apps, as published (built, if not published yet)
        shell: bash
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/seed-store.sh --build busybox node --pull zig rust ripgrep bat go fzf zot oras skopeo cosign cmake zstd mingit python python-sdk java-sdk java maven gradle pdfbox plantuml zls texlive gdal postgresql osm2pgsql perl php composer 2>&1 | tee "$(cygpath -u "$LOG_DIR")/seed.txt"

      - name: Dockerfile conversion with native toolchains
        shell: pwsh
        run: ./tests/dockerfile.ps1 -SeedDownloads "$env:RUNNER_TEMP\store\cache\downloads"

      # The suites run whether or not the steps before them passed.
      - name: tests/store.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/store.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/store.txt"

      - name: tests/sandbox.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/sandbox.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/sandbox.txt"

      - name: tests/batch.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/batch.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/batch.txt"

      - name: tests/mounts.sh (offline)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/mounts.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/mounts.txt"

      - name: tests/ctrlc.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/ctrlc.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/ctrlc.txt"

      # Services, proxies and AppContainer profiles, with tests/cmd/netprobe
      # as the app, in a store of its own; last, the probe's report of what
      # this Windows lets AppContainers do on the loopback.
      - name: tests/network.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/network.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/network.txt"

      # What a run may reach of the rest of the machine: quasidock-host, with
      # small test apps.
      - name: tests/reach.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/reach.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/reach.txt"

      # What the Release workflow publishes, and installing it.
      - name: tests/install.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/install.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/install.txt"

      # zot is the app recipes/zot.json builds, here as published (which a
      # published job checks); tests/zot.sh runs it with quasidock.
      - name: tests/registry.sh, against two local zot registries
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/zot.sh bash tests/registry.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/registry.txt"

      # Lazy pulls: Cloud Files placeholders, their helper, and the swap, against a
      # registry. The runner's temporary directory is on NTFS, which can have them;
      # its job lets nothing break away, so helpers stay in it (iteration 77's probe).
      - name: tests/lazy.sh, against a local zot registry
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/zot.sh bash tests/lazy.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/lazy.txt"

      # What pull does with images' signatures, against a registry.
      - name: tests/signing.sh, against a local zot registry
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/zot.sh bash tests/signing.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/signing.txt"

      # ORAS, skopeo and cosign as published, in the seeded store, against
      # two local zot registries again.
      - name: tests/oci.sh, against two local zot registries
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OCI_HOME: ${{ runner.temp }}\store
        run: bash tests/zot.sh bash tests/oci.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/oci.txt"

      # ZLS as published (which a published job checks), in the seeded store.
      - name: tests/zls.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ZLS_HOME: ${{ runner.temp }}\store
        run: bash tests/zls.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/zls.txt"

      # TeX Live as published, with Perl's and Ghostscript's images as its
      # base images, in the seeded store.
      - name: tests/texlive.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TEXLIVE_HOME: ${{ runner.temp }}\store
        run: bash tests/texlive.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/texlive.txt"

      # GDAL's tools as published, in the seeded store, in each sandbox.
      - name: tests/gdal.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GDAL_HOME: ${{ runner.temp }}\store
        run: bash tests/gdal.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/gdal.txt"

      # PostgreSQL as published, with Perl's and Python's images as its
      # base images, in the seeded store: its server in each sandbox, its
      # service on a port of its own (--port), away from the runner's
      # PostgreSQL's 5432.
      - name: tests/postgresql.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          POSTGRES_HOME: ${{ runner.temp }}\store
        run: bash tests/postgresql.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/postgresql.txt"

      # osm2pgsql as published: tile expiry and missing-PostGIS diagnostics
      # against the base PostgreSQL image. A custom image with PostGIS also
      # enables the full import checks, including AppContainer forwarding.
      - name: tests/osm2pgsql.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OSM2PGSQL_HOME: ${{ runner.temp }}\store
        run: bash tests/osm2pgsql.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/osm2pgsql.txt"

      # Which apps trust a root CA added to Windows, as a network that
      # inspects TLS adds one, in the seeded store: the suite makes a test CA
      # for the run, and as the runner is elevated, adds it to
      # LocalMachine\Root and takes it out after.
      - name: tests/certs.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CERTS_HOME: ${{ runner.temp }}\store
        run: bash tests/certs.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/certs.txt"

      # Last, in the seeded store, whose apps it runs: it changes their data.
      - name: tests/matrix.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
          # zig's project check compiles zig's build runner with a cold cache.
          MATRIX_TIMEOUT: 600
          LOG_DIR: ${{ runner.temp }}\logs
        run: bash tests/matrix.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/matrix.txt"

      # What all of the above left on this user's own folders: a suite's store
      # isn't the default one, so none should have got them.
      - name: No suite labelled the runner's folders
        if: ${{ !cancelled() }}
        shell: bash
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
        run: |
          out/bin/quasidock.exe grants | tee "$(cygpath -u "$LOG_DIR")/grants.txt"
          ! grep -q 'Not explained' "$(cygpath -u "$LOG_DIR")/grants.txt"

      - name: Upload the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-suites
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore

  # Run as a real standard user, which the runner's own account isn't: it's
  # elevated. It makes one, that lasts as long as the runner does.
  standard-user:
    needs: pins
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: A throwaway standard user
        shell: bash
        run: |
          # 14 characters: above that, net user asks whether to go on, and with no
          # one to answer, gives up. The account lasts as long as the runner.
          password="$(od -An -tx1 -N5 /dev/urandom | tr -d ' \n')Aa1-"
          echo "::add-mask::$password"
          # (Or Git Bash takes /add for a path.)
          MSYS_NO_PATHCONV=1 net user zstest "$password" /add
          printf 'zstest\n%s\n' "$password" >"$RUNNER_TEMP/account.txt"
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"
          mkdir -p "$t/logs"

      - name: Seed BusyBox sources from GHCR
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\seed-store
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          go run ./cmd/quasidock-publish seed-busybox
          "SEED_DOWNLOADS=$env:QUASIDOCK_HOME\cache\downloads" >> $env:GITHUB_ENV

      - name: tests/standard-user.sh
        shell: bash
        run: bash tests/standard-user.sh "$RUNNER_TEMP/account.txt" 2>&1 | tee "$(cygpath -u "$LOG_DIR")/standard-user.txt"

      - name: Upload the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-standard-user
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore

  build:
    needs: [groups, pins]
    name: build (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.build) }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Seed BusyBox sources from GHCR
        env:
          QUASIDOCK_HOME: ${{ runner.temp }}\store
          QUASIDOCK_REGISTRY_USERNAME: ${{ github.actor }}
          QUASIDOCK_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          go run ./cmd/quasidock-publish seed-busybox
          "SEED_DOWNLOADS=$env:QUASIDOCK_HOME\cache\downloads" >> $env:GITHUB_ENV

      - name: Unit tests
        if: matrix.group == 'base'
        run: go test ./...

      - name: Build quasidock
        run: go run ./scripts/build.go

      - name: tests/build.sh, the group's sections
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/build.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/build.txt"

      - name: Upload the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-build-${{ matrix.group }}
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore
