# Enable with -D TLS and supply PEM certificate/key paths in the environment.
Listen 127.0.0.1:${HTTPD_HTTPS_PORT} https
SSLSessionCache "shmcb:${HTTPD_DATA}/ssl-cache(512000)"
SSLSessionCacheTimeout 300
<VirtualHost 127.0.0.1:${HTTPD_HTTPS_PORT}>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "${HTTPD_TLS_CERT_FILE}"
    SSLCertificateKeyFile "${HTTPD_TLS_KEY_FILE}"
</VirtualHost>
