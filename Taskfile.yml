version: '3'

env:
  # Different Go versions can produce different gzip digests. Since Quasidock uses the Go toolchain to build several images, we pin the version here to ensure reproducible builds.
  GOTOOLCHAIN: 'go1.26.8'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the Windows executables in out/bin
    cmds:
      - go run ./scripts/build.go {{.CLI_ARGS}}

  build:strip:
    desc: Build stripped Windows executables in out/bin
    cmds:
      - go run ./scripts/build.go --strip {{.CLI_ARGS}}

  run:
    desc: Build and run Quasidock (task run -- help)
    deps:
      - task: build
        vars:
          CLI_ARGS: ''
    cmds:
      - ./out/bin/quasidock.exe {{.CLI_ARGS}}

  test:
    desc: Run all Go tests without cached results
    cmds:
      - go test -count=1 {{.CLI_ARGS}} ./...

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  lint:build:
    desc: Build the golangci-lint image from pinned sources
    cmds:
      - task: build
        vars:
          CLI_ARGS: ''
      - ./out/bin/quasidock.exe build recipes/golangci-lint.json

  lint:
    desc: Lint Go code and save out/golangci-lint.json (task lint -- --verbose)
    deps:
      - task: lint:build
        vars:
          CLI_ARGS: ''
    cmds:
      - ./out/bin/quasidock.exe run --rm --pull=never --entrypoint=golangci-lint.exe -v 'quasidock-lint-cache:${data}/cache' golangci-lint run --config .golangci.yml {{.CLI_ARGS}} ./...

  check:
    desc: Run static analysis and tests
    cmds:
      - task: vet
      - task: test
